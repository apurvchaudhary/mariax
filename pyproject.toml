[project]
name = "mariax"
version = "1.0.0"
description = "MariaDB extended helpers: Vector columns, vector indexes, similarity queries, and framework integrations."
authors = [{name="Apurv Chaudhary", email="apurv.sirohi@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
"typing-extensions>=4.0",
"mysqlclient>=2.2.0"
]


[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"